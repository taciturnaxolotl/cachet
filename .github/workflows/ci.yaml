name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest

    # The Postgres half of the suite skips itself unless TEST_DATABASE_URL is
    # set, so CI has to supply a real server or the backend goes unverified.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cachet
          POSTGRES_PASSWORD: cachet
          POSTGRES_DB: cachet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cachet -d cachet"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bunx @biomejs/biome format --error-on-warnings .

      - name: Lint
        run: bunx @biomejs/biome lint --error-on-warnings .

      - name: Test
        run: bun test
        env:
          SLACK_SIGNING_SECRET: ci-test-secret
          SLACK_BOT_TOKEN: xoxb-ci-test-token
          TEST_DATABASE_URL: postgres://cachet:cachet@127.0.0.1:5432/cachet

      - name: Build
        run: bun run build
