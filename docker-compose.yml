# Cachet with an external Postgres, so the app itself needs no volume.
#
#   docker compose up -d
#
# Only the `db` service keeps a volume. No state lives in the app container, so
# an orchestrator can run as many replicas of it as it likes. (This file itself
# publishes a fixed host port, so scaling it in place would collide on 3000.)
#
# To go back to the single-container SQLite setup, drop DATABASE_URL, mount a
# volume at /data, and set DATABASE_PATH=/data/cachet.db -- the default path is
# relative and lands inside the image at /app/data, not on the volume.

services:
  cachet:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Selects the Postgres backend. Without this, the app falls back to a
      # SQLite file at DATABASE_PATH.
      DATABASE_URL: postgres://cachet:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cachet
      PORT: 3000
      NODE_ENV: production
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?set SLACK_BOT_TOKEN in .env}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:?set SLACK_SIGNING_SECRET in .env}
      BEARER_TOKEN: ${BEARER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cachet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cachet
    volumes:
      - cachet-pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app creates its schema on boot, so it only needs the server up.
      test: ["CMD-SHELL", "pg_isready -U cachet -d cachet"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  cachet-pgdata:
